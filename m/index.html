<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://freechess-com.netlify.app https://lichess.org http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f1e1c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>freeChess.com on your phone</title>
<link rel="stylesheet" href="chessground.base.css"><link rel="stylesheet" href="chessground.cburnett.css">
<style>
:root { --bg:#262421; --bg2:#1f1e1c; --card:#312e2b; --card2:#3a3733; --line:#45423e; --text:#fff; --dim:#bab9b8; --green:#81b64c; --green-sh:#45753c; --red:#fa412d; --amber:#e3aa24; color-scheme:dark; }
:root[data-theme="light"] { --bg:#f1f1ef; --bg2:#e7e6e3; --card:#fff; --card2:#f4f4f2; --line:#e0dfdc; --text:#312e2b; --dim:#6b6966; color-scheme:light; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; overscroll-behavior:none; }
body { -webkit-text-size-adjust:100%; }
#app { min-height:100%; display:flex; flex-direction:column; max-width:640px; margin:0 auto; }
svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.splash { flex:1; display:flex; align-items:center; justify-content:center; font-size:64px; color:var(--green); min-height:100vh; }
/* top bar */
.topbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:var(--bg2); border-bottom:1px solid var(--line); }
.brand { font-size:20px; color:var(--green); white-space:nowrap; } .brand b { color:var(--text); font-weight:800; font-size:17px; letter-spacing:-.01em; }
.stats { flex:1; display:flex; align-items:center; gap:10px; justify-content:flex-end; font-size:13px; min-width:0; } .stats .dim { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.streak { display:inline-flex; align-items:center; gap:3px; color:var(--dim); font-weight:800; } .streak.lit { color:#ff8a3d; } .streak svg { width:18px; height:18px; } .streak.lit svg { fill:#ff8a3d; stroke:#ff8a3d; }
.iconbtn { background:none; border:0; color:var(--text); padding:6px; border-radius:8px; display:inline-flex; cursor:pointer; } .iconbtn:active { background:var(--card2); }
/* views */
.view { flex:1; display:flex; flex-direction:column; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
.view.list { padding:14px 14px calc(84px + env(safe-area-inset-bottom)); gap:12px; }
.h1 { margin:4px 2px 2px; font-size:24px; font-weight:800; }
.card { background:var(--card); border-radius:14px; padding:14px 16px; }
.dim { color:var(--dim); } .small { font-size:12.5px; } .center { text-align:center; } p { margin:6px 0; }
.hero { text-align:center; padding:18px 8px 4px; } .hero h1 { margin:6px 0; font-size:26px; font-weight:800; } .hero p { color:var(--dim); } .logo { font-size:54px; color:var(--green); line-height:1; }
label { font-weight:700; display:block; } .check { display:flex; gap:8px; align-items:center; font-weight:500; margin:12px 0 2px; } .check input { width:20px; height:20px; accent-color:var(--green); }
#code { width:100%; margin-top:8px; padding:14px 12px; font:700 16px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.05em; border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--text); text-transform:uppercase; }
#code:focus { outline:none; border-color:var(--green); }
.btnrow { display:flex; gap:10px; margin-top:12px; } .btnrow .btn { flex:1; }
.btn { border:0; border-radius:10px; padding:14px; font:800 16px inherit; font-family:inherit; background:var(--card2); color:var(--text); cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.25); }
.btn.primary { background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-sh); } .btn:active { transform:translateY(2px); box-shadow:none; } .btn.wide { width:100%; }
.msg { min-height:1.2em; color:var(--amber); font-size:13.5px; }
.tilebtn { display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card); border:0; border-radius:14px; padding:16px; color:var(--text); font:inherit; cursor:pointer; }
.tilebtn:active { background:var(--card2); } .tilebtn svg { width:30px; height:30px; color:var(--green); flex:none; } .tilebtn div { flex:1; } .tilebtn b { display:block; font-size:17px; } .tilebtn span { color:var(--dim); font-size:13.5px; } .chev { font-style:normal; font-size:26px; color:var(--dim); }
.plan .planhead { display:flex; justify-content:space-between; margin-bottom:6px; } .step { display:flex; gap:12px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
.step b { display:block; font-weight:600; font-size:14.5px; } .step .dim { font-size:12.5px; } .tick { flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; }
.step.done .tick { background:var(--green); border-color:var(--green); color:#fff; } .step.done b { color:var(--dim); text-decoration:line-through; } .tick svg { width:15px; height:15px; stroke-width:3; }
.c30 .bar { height:8px; border-radius:4px; background:var(--card2); margin:8px 0 4px; overflow:hidden; } .c30 .bar i { display:block; height:100%; background:var(--green); }
.empty { text-align:center; padding:40px 16px; display:flex; flex-direction:column; align-items:center; gap:6px; } .bigic { width:76px; height:76px; border-radius:50%; background:rgba(129,182,76,.15); color:var(--green); display:flex; align-items:center; justify-content:center; } .bigic svg { width:38px; height:38px; } .empty h2 { margin:8px 0 0; }
.notes { display:flex; flex-direction:column; gap:8px; } .note { display:flex; gap:12px; text-align:left; background:var(--card); border:0; border-radius:12px; padding:10px; color:var(--text); font:inherit; cursor:pointer; } .note p { margin:0 0 4px; font-size:14px; white-space:pre-wrap; word-break:break-word; }
.mini { flex:none; display:grid; grid-template-columns:repeat(8,1fr); width:84px; height:84px; border-radius:4px; overflow:hidden; } .mini i { display:flex; align-items:center; justify-content:center; font-style:normal; font-size:10px; } .mini i.l { background:#eeeed2; } .mini i.d { background:#769656; } .mini b.w { color:#fff; -webkit-text-stroke:.4px #000; } .mini b.k { color:#000; }
/* play screen */
.view.play { padding-left:0; padding-right:0; }
.strip { display:flex; align-items:center; gap:8px; padding:8px 12px; min-height:40px; font-size:14px; } .strip .dim:last-child { margin-left:auto; } .strip.top { justify-content:space-between; }
.side { width:18px; height:18px; border-radius:4px; border:1px solid var(--line); } .side.white { background:#fff; } .side.black { background:#000; }
.pzstreak { display:inline-flex; align-items:center; gap:3px; color:#ff8a3d; font-weight:800; } .pzstreak svg { width:18px; height:18px; fill:#ff8a3d; stroke:#ff8a3d; }
.dots { display:flex; gap:5px; } .dots i { width:9px; height:9px; border-radius:50%; background:var(--card2); } .dots i.done { background:var(--green); } .dots i.now { background:var(--text); }
.boardhost { position:relative; display:flex; justify-content:center; }
.board { touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.badge { position:absolute; z-index:3; width:28px; height:28px; margin:-10px 0 0 -18px; border-radius:50%; display:none; align-items:center; justify-content:center; color:#fff; font-weight:900; box-shadow:0 2px 4px rgba(0,0,0,.4); pointer-events:none; }
.badge.show { display:flex; animation:pop .25s ease-out; } .badge.ok { background:var(--green); } .badge.bad { background:var(--red); } .badge svg { width:16px; height:16px; stroke-width:3.5; }
@keyframes pop { from { transform:scale(.3); } }
.bubble { display:flex; gap:10px; align-items:flex-start; margin:8px 12px 0; padding:12px 14px; background:var(--card); border-radius:14px; min-height:64px; border-left:4px solid transparent; }
.bubble.good { border-left-color:var(--green); } .bubble.bad { border-left-color:var(--red); } .bubble p { margin:2px 0 0; color:var(--dim); font-size:14px; } .bubble b { font-size:16px; }
.av { flex:none; width:36px; height:36px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; }
.actbar { display:flex; gap:8px; padding:10px 12px; margin-top:auto; }
.act { flex:1; border:0; border-radius:10px; padding:13px 8px; font:800 15px inherit; font-family:inherit; background:var(--card2); color:var(--text); cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.25); }
.act.primary { background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-sh); } .act:active { transform:translateY(2px); box-shadow:none; }
/* chess.com-like board: green squares, round move dots */
cg-board { background:conic-gradient(#769656 90deg, #eeeed2 0 180deg, #769656 0 270deg, #eeeed2 0) 0 0 / 25% 25%; }
cg-board square.last-move { background:rgba(255,255,51,.45); } cg-board square.selected { background:rgba(255,255,51,.55); }
cg-board square.move-dest { background:radial-gradient(rgba(0,0,0,.16) 22%, transparent 23%); } cg-board square.move-dest:hover { background:rgba(0,0,0,.08); }
cg-board square.oc.move-dest { background:radial-gradient(transparent 0, transparent 79%, rgba(0,0,0,.16) 80%); }
cg-board square.check { background:radial-gradient(ellipse at center, rgba(255,0,0,1) 0%, rgba(231,0,0,1) 25%, rgba(169,0,0,0) 89%); }
.cg-wrap coords { font-weight:700; font-size:10px; } .cg-wrap coords.ranks { left:2px; } .cg-wrap coords coord { color:rgba(0,0,0,.55) !important; }
/* tabs */
.tabs { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; background:var(--bg2); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); max-width:640px; margin:0 auto; }
.tabs button { flex:1; position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:0; color:var(--dim); font:600 11.5px inherit; font-family:inherit; padding:9px 0 8px; cursor:pointer; }
.tabs button.on { color:var(--text); } .tabs button.on svg { color:var(--green); }
.tabs .dot { position:absolute; top:4px; left:calc(50% + 6px); min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--red); color:#fff; font:800 10.5px/17px inherit; font-style:normal; } .tabs .dot:empty { display:none; }
/* menu sheet */
.sheet { position:fixed; inset:0; z-index:9; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; } .sheet[hidden] { display:none; }
.sheetbox { width:100%; max-width:640px; margin:0 auto; background:var(--card); border-radius:16px 16px 0 0; padding:12px 12px calc(12px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:4px; animation:up .2s ease-out; }
@keyframes up { from { transform:translateY(40px); opacity:0; } }
.row-btn { display:block; text-align:left; width:100%; background:none; border:0; color:var(--text); font:600 16px inherit; font-family:inherit; padding:14px 8px; border-radius:10px; text-decoration:none; cursor:pointer; } .row-btn:active { background:var(--card2); } .sheetbox > .dim { padding:4px 8px; margin:0; font-size:13px; }
#toast { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); opacity:0; background:#111; color:#fff; padding:10px 16px; border-radius:10px; transition:.2s; pointer-events:none; font-size:14px; z-index:10; max-width:calc(100vw - 32px); }
#toast.show { opacity:1; transform:translate(-50%, 0); } #toast.bad { background:#7a1f16; }
a { color:var(--green); }
/* lessons */
.lrow { display:flex; align-items:center; gap:12px; width:100%; background:none; border:0; border-top:1px solid var(--line); padding:11px 2px; color:var(--text); font:600 15px inherit; font-family:inherit; text-align:left; cursor:pointer; } .lrow.lock { color:var(--dim); }
.ldot { flex:none; width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; } .ldot.done { background:var(--green); border-color:var(--green); color:#fff; } .ldot svg { width:15px; height:15px; stroke-width:3; }
.lstars { margin-left:auto; color:#e3aa24; letter-spacing:1px; }
.view.lessonview { padding:0 0 calc(72px + env(safe-area-inset-bottom)); }
.ls { display:flex; flex-direction:column; gap:10px; padding:10px 0; } .ls-top { display:flex; align-items:center; gap:10px; padding:0 12px; } .ls-x { background:none; border:0; color:var(--text); font-size:22px; }
.ls-prog { flex:1; height:12px; border-radius:6px; background:var(--card2); overflow:hidden; } .ls-prog i { display:block; height:100%; width:0; background:var(--green); transition:width .35s; }
.ls-boardwrap { position:relative; width:100vw; max-width:640px; aspect-ratio:1; } .ls-board { width:100%; height:100%; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.ls-badge { position:absolute; z-index:3; width:28px; height:28px; margin:-10px 0 0 -18px; border-radius:50%; display:none; align-items:center; justify-content:center; color:#fff; font-weight:900; pointer-events:none; } .ls-badge.show { display:flex; } .ls-badge.ok { background:var(--green); } .ls-badge.bad { background:var(--red); }
.ls-side { padding:0 12px; display:flex; flex-direction:column; gap:10px; } .ls-coach { display:flex; gap:10px; } .ls-av { flex:none; width:38px; height:38px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; }
.ls-say { flex:1; background:var(--card); border-radius:14px; padding:12px 14px; font-size:14.5px; border-left:4px solid transparent; } .ls-say > b { display:block; font-size:16px; } .ls-say p { margin:4px 0 0; color:var(--dim); } .ls-say.good { border-left-color:var(--green); } .ls-say.bad { border-left-color:var(--red); }
.ls-acts { display:flex; gap:8px; flex-wrap:wrap; } .ls-btn { flex:1; min-width:120px; border:0; border-radius:10px; padding:13px 10px; font:800 15px inherit; font-family:inherit; background:var(--card2); color:var(--text); box-shadow:0 3px 0 rgba(0,0,0,.25); } .ls-btn.primary { background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-sh); }
.ls-done { text-align:center; padding:30px 16px; display:flex; flex-direction:column; align-items:center; gap:6px; } .ls-done .ls-acts { width:100%; } .ls-stars i { font-style:normal; font-size:48px; color:var(--card2); margin:0 4px; } .ls-stars i.on { color:#e3aa24; } .ls-dim { color:var(--dim); font-size:13px; }
.tabs button span { font-size:11px; }
</style>
</head>
<body><main id="app"><div class="splash">♞</div></main><div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
